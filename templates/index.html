<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>مركز سرعة إنجاز — تليجرام</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>

    <style>
        :root {
            --tg-blue: #0088cc;
            --tg-blue-light: #54a0ff;
            --tg-blue-dark: #006699;
            --tg-bg: #ffffff;
            --tg-bg-secondary: #f0f0f0;
            --tg-bg-chat: #e6ebf0;
            --tg-text: #222222;
            --tg-text-secondary: #707579;
            --tg-text-light: #999999;
            --tg-border: #d5d9dd;
            --tg-shadow: 0 2px 8px rgba(0,0,0,0.08);
            --tg-radius: 12px;
            --tg-radius-sm: 8px;
            --tg-radius-lg: 24px;
            --tg-transition: 0.25s cubic-bezier(0.4,0,0.2,1);
            --tg-left-width: 380px;
            --tg-header-height: 52px;
        }
        [data-theme="dark"] {
            --tg-bg: #1a1a2e;
            --tg-bg-secondary: #242436;
            --tg-bg-chat: #0f0f1a;
            --tg-text: #e8e8e8;
            --tg-text-secondary: #a0a0b0;
            --tg-text-light: #6a6a7a;
            --tg-border: #33334a;
            --tg-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Tajawal',sans-serif; }
        body { background:var(--tg-bg); color:var(--tg-text); height:100vh; overflow:hidden; transition:var(--tg-transition); }
        ::-webkit-scrollbar { width:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:var(--tg-blue); border-radius:4px; }

        /* ===== الحاوية الرئيسية ===== */
        .app-container { display:flex; height:100vh; width:100vw; overflow:hidden; }

        /* ===== Drawer ===== */
        .drawer-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; }
        .drawer-overlay.open { display:block; }
        .drawer {
            position:fixed; top:0; right:0; bottom:0;
            width:var(--tg-left-width); max-width:85%;
            background:var(--tg-bg-secondary);
            border-left:1px solid var(--tg-border);
            transform:translateX(110%);
            transition:transform 0.3s cubic-bezier(0.4,0,0.2,1);
            z-index:1001; display:flex; flex-direction:column; overflow:hidden;
            box-shadow:var(--tg-shadow);
        }
        .drawer.open { transform:translateX(0); }
        .drawer-header { padding:16px 16px 8px; border-bottom:1px solid var(--tg-border); flex-shrink:0; }
        .drawer-header .profile { display:flex; align-items:center; gap:12px; cursor:pointer; }
        .drawer-header .profile .avatar {
            width:48px; height:48px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:20px; font-weight:700; color:#fff; background:#6c5ce7; flex-shrink:0;
        }
        .drawer-header .profile .info { flex:1; min-width:0; }
        .drawer-header .profile .info .name { font-size:16px; font-weight:700; color:var(--tg-text); }
        .drawer-header .profile .info .phone { font-size:13px; color:var(--tg-text-secondary); }
        .drawer-header .close-btn { background:none; border:none; color:var(--tg-text-secondary); font-size:22px; cursor:pointer; padding:4px; }
        .drawer-menu { flex:1; overflow-y:auto; padding:8px 0; }
        .drawer-menu .menu-item {
            display:flex; align-items:center; gap:12px; padding:10px 16px;
            cursor:pointer; transition:var(--tg-transition);
            border-radius:var(--tg-radius-sm); margin:0 4px;
            color:var(--tg-text); font-size:15px; font-weight:500;
            border:none; background:none; width:100%; text-align:right;
            font-family:'Tajawal',sans-serif;
        }
        .drawer-menu .menu-item:hover { background:var(--tg-border); }
        .drawer-menu .menu-item i { width:24px; text-align:center; color:var(--tg-text-secondary); font-size:18px; }
        .drawer-menu .menu-item .badge-drawer {
            margin-right:auto; background:var(--tg-border);
            padding:0 8px; border-radius:12px; font-size:12px; color:var(--tg-text-secondary);
        }
        .drawer-menu .divider { height:1px; background:var(--tg-border); margin:6px 16px; }
        .drawer-menu .menu-item.add-account { color:var(--tg-blue); }
        .drawer-menu .menu-item.add-account i { color:var(--tg-blue); }
        .drawer-menu .menu-item.add-account:hover { background:rgba(0,136,204,0.08); }

        /* ===== اللوح الأيسر (قائمة المحادثات) ===== */
        .left-pane {
            width:var(--tg-left-width); min-width:var(--tg-left-width);
            display:flex; flex-direction:column; height:100vh;
            background:var(--tg-bg); border-left:1px solid var(--tg-border);
            flex-shrink:0;
        }
        .main-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:8px 14px; height:var(--tg-header-height);
            border-bottom:1px solid var(--tg-border);
            background:var(--tg-bg-secondary); flex-shrink:0;
        }
        .main-header .brand { display:flex; align-items:center; gap:8px; font-size:20px; font-weight:800; color:var(--tg-blue); }
        .main-header .brand i { font-size:28px; }
        .main-header .brand span { color:var(--tg-text); }
        .main-header .actions { display:flex; gap:2px; }
        .main-header .actions button {
            background:none; border:none; color:var(--tg-text-secondary);
            font-size:20px; padding:4px 8px; border-radius:var(--tg-radius-sm);
            transition:var(--tg-transition); cursor:pointer;
        }
        .main-header .actions button:hover { background:var(--tg-border); color:var(--tg-blue); }
        .search-bar { padding:6px 14px; flex-shrink:0; background:var(--tg-bg-secondary); border-bottom:1px solid var(--tg-border); }
        .search-bar .search-wrap {
            display:flex; align-items:center;
            background:var(--tg-bg); border:1px solid var(--tg-border);
            border-radius:var(--tg-radius-lg); padding:0 12px; transition:var(--tg-transition);
        }
        .search-bar .search-wrap:focus-within { border-color:var(--tg-blue); box-shadow:0 0 0 3px rgba(0,136,204,0.15); }
        .search-bar .search-wrap i { color:var(--tg-text-light); font-size:14px; }
        .search-bar .search-wrap input {
            flex:1; background:none; border:none; padding:6px 8px;
            color:var(--tg-text); font-size:14px; outline:none; font-family:'Tajawal',sans-serif;
        }
        .search-bar .search-wrap input::placeholder { color:var(--tg-text-light); }

        /* قائمة المحادثات */
        .chat-list { flex:1; overflow-y:auto; padding:4px 0; background:var(--tg-bg); display:flex; flex-direction:column; }
        .chat-item {
            display:flex; align-items:center; padding:8px 14px; cursor:pointer;
            transition:var(--tg-transition); border-radius:var(--tg-radius-sm);
            margin:0 4px; gap:12px; position:relative;
        }
        .chat-item:hover { background:var(--tg-border); }
        .chat-item.active { background:rgba(0,136,204,0.12); }
        .chat-item .avatar {
            width:48px; height:48px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:18px; font-weight:700; color:#fff; flex-shrink:0; position:relative;
        }
        .chat-item .avatar .online-dot {
            position:absolute; bottom:0; right:0; width:12px; height:12px;
            border-radius:50%; background:#4cd964; border:2px solid var(--tg-bg);
        }
        .chat-item .info { flex:1; min-width:0; }
        .chat-item .info .row1 { display:flex; justify-content:space-between; align-items:baseline; }
        .chat-item .info .name { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .chat-item .info .time { font-size:11px; color:var(--tg-text-light); flex-shrink:0; }
        .chat-item .info .preview { font-size:14px; color:var(--tg-text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .chat-item .badge {
            background:var(--tg-blue); color:#fff; border-radius:50%; font-size:11px;
            padding:0 6px; min-width:20px; height:20px;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }
        .chat-item .skeleton { animation:skeleton-pulse 1.2s ease-in-out infinite; }
        @keyframes skeleton-pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

        /* ═══ شريط التحديد المتعدد ═══ */
        .selection-bar {
            display:flex; align-items:center; padding:0 8px; height:56px;
            background:var(--tg-blue); flex-shrink:0; gap:4px;
            animation:selBarIn .2s ease;
        }
        @keyframes selBarIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
        .sel-btn {
            width:40px; height:40px; border-radius:50%; background:none; border:none;
            color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center;
            font-size:18px; transition:background .15s; flex-shrink:0;
        }
        .sel-btn:hover { background:rgba(255,255,255,.18); }
        .sel-btn.danger { color:#ffaaaa; }
        .sel-count { font-size:18px; font-weight:700; color:#fff; padding:0 4px; min-width:24px; text-align:center; }
        /* طبقة ✓ على الأفاتار */
        .chat-item .av-letter { display:block; }
        .chat-item .av-check {
            position:absolute; inset:0; border-radius:50%;
            background:rgba(0,136,204,.88);
            display:none; align-items:center; justify-content:center;
            color:#fff; font-size:19px;
        }
        .sel-mode .chat-item .av-check { display:flex; opacity:0; transition:opacity .15s; }
        .sel-mode .chat-item.selected .av-check { opacity:1; }
        .sel-mode .chat-item.selected { background:rgba(0,136,204,.13); }

        /* حالة فارغة */
        .empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:12px; color:var(--tg-text-secondary); }
        .empty-state i { font-size:48px; opacity:0.3; }
        .empty-state p { font-size:14px; }

        /* ===== اللوح الأيمن (نافذة المحادثة) ===== */
        .right-pane { flex:1; display:flex; flex-direction:column; height:100%; background:var(--tg-bg-chat); overflow:hidden; }

        /* حالة لا يوجد محادثة مختارة */
        .no-chat-state {
            flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
            gap:16px; color:var(--tg-text-secondary);
        }
        .no-chat-state i { font-size:64px; opacity:0.2; }
        .no-chat-state h3 { font-size:20px; font-weight:700; opacity:0.5; }
        .no-chat-state p { font-size:14px; opacity:0.4; }

        /* ===== واجهة المحادثة ===== */
        .chat-view { display:none; flex-direction:column; height:100%; max-height:100%; }
        .chat-view.open { display:flex; }

        .chat-header {
            display:flex; align-items:center; justify-content:space-between;
            padding:4px 8px; border-bottom:1px solid var(--tg-border);
            background:var(--tg-bg-secondary); flex-shrink:0; min-height:var(--tg-header-height);
        }
        .chat-header .back { background:none; border:none; color:var(--tg-text); font-size:20px; cursor:pointer; padding:4px; display:none; }
        .chat-header .h-info { display:flex; align-items:center; gap:8px; flex:1; min-width:0; cursor:pointer; }
        .chat-header .h-info .h-avatar {
            width:38px; height:38px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:16px; font-weight:700; color:#fff; flex-shrink:0;
        }
        .chat-header .h-info .h-details { flex:1; min-width:0; }
        .chat-header .h-info .h-details .h-name { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .chat-header .h-info .h-details .h-status { font-size:12px; color:var(--tg-text-light); }
        .chat-header .h-info .h-details .h-status.online { color:#4cd964; }
        .chat-header .h-tools { display:flex; gap:2px; }
        .chat-header .h-tools button {
            background:none; border:none; color:var(--tg-text-secondary);
            cursor:pointer; padding:4px 6px; border-radius:var(--tg-radius-sm);
            transition:var(--tg-transition); font-size:18px;
        }
        .chat-header .h-tools button:hover { color:var(--tg-blue); background:var(--tg-border); }

        /* ردّ على رسالة */
        .reply-bar {
            display:none; align-items:center; gap:8px; padding:6px 12px;
            background:var(--tg-bg-secondary); border-bottom:1px solid var(--tg-border);
            border-right:3px solid var(--tg-blue); flex-shrink:0;
        }
        .reply-bar.show { display:flex; }
        .reply-bar .reply-text { flex:1; font-size:13px; color:var(--tg-text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .reply-bar .reply-cancel { background:none; border:none; color:var(--tg-text-light); cursor:pointer; font-size:18px; }

        /* ===== الرسائل ===== */
        .messages-area {
            flex:1; overflow-y:auto; padding:10px 16px 4px;
            display:flex; flex-direction:column; gap:2px;
        }
        .msg { display:flex; flex-direction:column; max-width:76%; animation:msgIn 0.2s ease; }
        .msg.sent { align-self:flex-end; }
        .msg.received { align-self:flex-start; }
        @keyframes msgIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
        .msg .bubble {
            padding:7px 12px; border-radius:16px; font-size:14px;
            line-height:1.55; word-wrap:break-word; position:relative;
            cursor:pointer;
        }
        .msg.sent .bubble { background:var(--tg-blue); color:#fff; border-bottom-left-radius:4px; }
        .msg.received .bubble { background:var(--tg-bg); color:var(--tg-text); border-bottom-right-radius:4px; border:1px solid var(--tg-border); }
        .msg .bubble:hover { filter:brightness(0.95); }
        .msg .bubble .sender { font-size:11px; font-weight:700; color:var(--tg-blue-light); margin-bottom:2px; cursor:pointer; transition:opacity .15s; }
        .msg.sent .bubble .sender { color:rgba(255,255,255,0.8); }
        .msg .bubble .sender:hover { opacity:.7; }
        .msg-link { color:#00d2ff !important; text-decoration:underline; word-break:break-all; cursor:pointer; }
        .msg-link:hover { opacity:.8; }
        @keyframes ctxFadeIn { from{opacity:0;transform:scale(.95) translateY(-4px)} to{opacity:1;transform:scale(1) translateY(0)} }
        /* نافذة الملف الشخصي */
        #senderProfileModal .sp-card { background:var(--tg-bg-secondary);border-radius:20px;overflow:hidden;min-width:300px;max-width:360px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:ctxFadeIn .2s ease; }
        .msg .bubble .text { white-space:pre-wrap; }
        .msg .bubble .foot { font-size:10px; opacity:0.65; margin-top:3px; display:flex; justify-content:flex-end; gap:4px; align-items:center; }
        .msg.sent .bubble .foot { color:rgba(255,255,255,0.75); }
        .msg.received .bubble .foot { color:var(--tg-text-light); }
        .msg .bubble .foot .ticks { letter-spacing:-1px; }
        /* رسالة مرفوضة */
        .msg .bubble.reply-to-preview {
            font-size:12px; padding:4px 8px; border-radius:8px;
            margin-bottom:4px; opacity:0.7;
            background:rgba(0,136,204,0.12); border-right:2px solid var(--tg-blue);
        }
        /* تاريخ الفاصل */
        .date-divider { text-align:center; margin:8px 0; }
        .date-divider span {
            background:rgba(0,136,204,0.12); color:var(--tg-text-secondary);
            font-size:11px; padding:3px 10px; border-radius:12px;
        }
        /* مؤشر الكتابة */
        .typing-indicator { display:none; align-self:flex-start; margin:4px 0; }
        .typing-indicator.show { display:flex; }
        .typing-indicator .bubble { background:var(--tg-bg); border:1px solid var(--tg-border); padding:8px 14px; border-radius:16px; border-bottom-right-radius:4px; }
        .typing-dots { display:flex; gap:3px; align-items:center; height:14px; }
        .typing-dots span { width:6px; height:6px; background:var(--tg-text-light); border-radius:50%; animation:typingDot 1.2s infinite; }
        .typing-dots span:nth-child(2) { animation-delay:0.2s; }
        .typing-dots span:nth-child(3) { animation-delay:0.4s; }
        @keyframes typingDot { 0%,60%,100%{transform:translateY(0);opacity:0.4} 30%{transform:translateY(-4px);opacity:1} }

        /* ===== شريط الإدخال ===== */
        .input-area {
            display:flex; align-items:flex-end; gap:6px; padding:6px 10px;
            border-top:1px solid var(--tg-border); background:var(--tg-bg-secondary); flex-shrink:0;
        }
        .input-area .input-wrap {
            flex:1; display:flex; align-items:flex-end;
            background:var(--tg-bg); border:1px solid var(--tg-border);
            border-radius:var(--tg-radius-lg); padding:4px 10px;
            transition:var(--tg-transition); gap:4px;
        }
        .input-area .input-wrap:focus-within { border-color:var(--tg-blue); box-shadow:0 0 0 3px rgba(0,136,204,0.12); }
        .input-area .input-wrap .icon-btn { background:none; border:none; color:var(--tg-text-secondary); cursor:pointer; padding:4px 2px; font-size:20px; transition:var(--tg-transition); flex-shrink:0; }
        .input-area .input-wrap .icon-btn:hover { color:var(--tg-blue); }
        .input-area .input-wrap textarea {
            flex:1; background:none; border:none; color:var(--tg-text);
            padding:4px 0; font-size:14px; resize:none; max-height:100px;
            min-height:28px; font-family:'Tajawal',sans-serif; outline:none; line-height:1.4;
        }
        .input-area .input-wrap textarea::placeholder { color:var(--tg-text-light); }
        .input-area .send-btn {
            background:var(--tg-blue); border:none; color:#fff; width:40px; height:40px;
            border-radius:50%; cursor:pointer; transition:var(--tg-transition);
            font-size:16px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
        }
        .input-area .send-btn:hover:not(:disabled) { transform:scale(1.08); box-shadow:0 0 20px rgba(0,136,204,0.35); }
        .input-area .send-btn:disabled { opacity:0.45; cursor:not-allowed; }

        /* ===== Toast ===== */
        .toast-container { position:fixed; bottom:20px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:6px; }
        .toast-custom {
            background:var(--tg-bg-secondary); color:var(--tg-text);
            border:1px solid var(--tg-border); border-radius:var(--tg-radius);
            padding:9px 14px; min-width:180px; max-width:300px;
            box-shadow:var(--tg-shadow); animation:toastIn 0.3s ease;
            font-size:13px; border-right:4px solid var(--tg-blue);
            transition:opacity 0.3s, transform 0.3s;
        }
        .toast-custom.success { border-right-color:#4cd964; }
        .toast-custom.error { border-right-color:#ff3b30; }
        .toast-custom.warning { border-right-color:#ffcc00; }
        .toast-custom.fade-out { opacity:0; transform:translateX(40px); }
        @keyframes toastIn { from{opacity:0;transform:translateX(40px)} to{opacity:1;transform:translateX(0)} }

        /* ===== الاستجابة للشاشات الصغيرة ===== */
        @media (max-width: 820px) {
            .left-pane { width:100%; min-width:100%; position:absolute; inset:0; z-index:2; }
            .left-pane.hidden { display:none; }
            .right-pane { width:100%; min-width:100%; position:absolute; inset:0; z-index:1; display:none; }
            .right-pane.active { display:flex; z-index:3; }
            .right-pane .chat-view { display:none; }
            .right-pane .chat-view.open { display:flex; }
            .right-pane .no-chat-state { display:none; }
            .chat-header .back { display:block; }
        }

        /* مؤشر التحميل */
        .loading-spinner { display:inline-block; width:18px; height:18px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.7s linear infinite; }
        @keyframes spin { to{transform:rotate(360deg)} }

        /* تحديد نص في القائمة */
        .chat-item * { user-select:none; }
    </style>
</head>
<body>

<!-- ===== Drawer ===== -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
    <div class="drawer-header">
        <div class="profile">
            <div class="avatar" id="drawerAvatar">؟</div>
            <div class="info">
                <div class="name" id="drawerName">...</div>
                <div class="phone" id="drawerPhone">...</div>
            </div>
            <button class="close-btn" onclick="closeDrawer()"><i class="fas fa-times"></i></button>
        </div>
    </div>
    <div class="drawer-menu">
        <button class="menu-item" onclick="showProfile()">
            <i class="fas fa-user-circle"></i> الملف الشخصي
        </button>
        <button class="menu-item" onclick="goToContacts()">
            <i class="fas fa-address-book"></i> جهات الاتصال
        </button>
        <button class="menu-item add-account" onclick="addAccount()">
            <i class="fas fa-plus-circle"></i> إضافة حساب
        </button>
        <button class="menu-item" onclick="goToFolders()">
            <i class="fas fa-folder"></i> مجلدات المحادثات
        </button>
        <button class="menu-item" onclick="goToBookmarks()">
            <i class="fas fa-bookmark"></i> الرسائل المحفوظة
            <span class="badge-drawer" id="bookmarksBadge" style="display:none">0</span>
        </button>
        <button class="menu-item" onclick="goToCalls()">

<script>
'use strict';

// ============================================================
//  المتغيرات الأساسية
// ============================================================
const CURRENT_USER_ID   = "{{ user_id }}";
const CURRENT_USER_NAME = "{{ user_name }}";

let socket            = null;
let chatsData         = [];         // بيانات المحادثات المحلية
let currentChatId     = null;       // معرف المحادثة المفتوحة
let currentChatData   = null;       // بيانات المحادثة المفتوحة
let replyToMsgId      = null;       // معرف الرسالة المراد الرد عليها
let typingTimer       = null;       // مؤقت مؤشر الكتابة
let isTyping          = false;
let chatMessages      = {};         // الرسائل المحملة { chat_id: [msgs] }
let currentTheme      = localStorage.getItem('theme') || 'dark';

// ============================================================
//  تهيئة Socket.IO
// ============================================================
function initSocket() {
    socket = io({ transports: ['polling', 'websocket'] });

    socket.on('connect', () => {
        socket.emit('register_user', { user_id: CURRENT_USER_ID });
    });

    socket.on('disconnect', () => {
        showToast('⚠️ انقطع الاتصال، يُعاد الاتصال...', 'warning');
    });

    socket.on('reconnect', () => {
        showToast('✅ تم إعادة الاتصال', 'success');
        socket.emit('register_user', { user_id: CURRENT_USER_ID });
        if (currentChatId) socket.emit('join_chat', { user_id: CURRENT_USER_ID, chat_id: currentChatId });
    });

    // استقبال رسالة جديدة
    socket.on('new_message', (msg) => {
        const chatId = msg.chat_id ? String(msg.chat_id) : null;
        if (!chatId) return;

        // تجنب تكرار رسائل صادرة (local_xxx أُضيفت فوراً عند الإرسال)
        if (msg.from_me) {
            const area = document.getElementById('messagesArea');
            const pending = area ? area.querySelectorAll('[data-msg-id^="local_"]') : [];
            if (pending.length) {
                // استبدل أول رسالة معلقة بالـ ID الحقيقي
                const first = pending[0];
                first.dataset.msgId = msg.id;
                first.setAttribute('oncontextmenu', `msgContextMenu(event,'${msg.id}')`);
                const tick = first.querySelector('[id^="tick-"]');
                if (tick) { tick.id = `tick-${msg.id}`; tick.textContent = '✓'; }
                updateChatLastMsg(chatId, msg);
                return;
            }
        }

        // تخزين الرسالة
        if (!chatMessages[chatId]) chatMessages[chatId] = [];
        chatMessages[chatId].push(msg);

        // إذا كانت المحادثة مفتوحة، أضف الرسالة مباشرة
        if (String(currentChatId) === chatId) {
            appendMessage(msg);
            // قراءة تلقائية
            socket.emit('mark_as_read', { user_id: CURRENT_USER_ID, chat_id: chatId });
        } else {
            // تحديث العداد في القائمة
            updateChatUnread(chatId);
            showToast(`📩 رسالة من ${msg.sender_name || 'مستخدم'}`, 'info');
        }

        // تحديث آخر رسالة في القائمة
        updateChatLastMsg(chatId, msg);
    });

    // رسالة صادرة من جهاز آخر — نحدّث القائمة فقط
    socket.on('outgoing_sync', (msg) => {
        const chatId = msg.chat_id ? String(msg.chat_id) : null;
        if (!chatId) return;
        if (!chatMessages[chatId]) chatMessages[chatId] = [];
        chatMessages[chatId].push(msg);
        updateChatLastMsg(chatId, msg);
    });

    // تم إرسال الرسالة بنجاح
    socket.on('message_sent', (data) => {
        markMsgDelivered(data.message_id);
    });

    // خطأ في الإرسال
    socket.on('message_error', (data) => {
        showToast('❌ فشل إرسال الرسالة', 'error');
        markMsgFailed(data.message_id);
    });

    // مؤشر الكتابة
    socket.on('user_typing', (data) => {
        if (String(data.chat_id) === String(currentChatId) && String(data.user_id) !== CURRENT_USER_ID) {
            showTypingIndicator(data.is_typing, data.user_id);
        }
    });

    // رسالة محذوفة
    socket.on('message_deleted', (data) => {
        if (String(data.chat_id) === String(currentChatId)) {
            const el = document.querySelector(`[data-msg-id="${data.message_id}"]`);
            if (el) { el.style.opacity = '0.4'; el.querySelector('.text').textContent = '🗑️ تم حذف هذه الرسالة'; }
        }
    });

    // رسالة معدّلة
    socket.on('message_edited', (data) => {
        if (String(data.chat_id) === String(currentChatId)) {
            const el = document.querySelector(`[data-msg-id="${data.message_id}"] .text`);
            if (el) { el.textContent = data.new_text; }
        }
    });
}

// ============================================================
//  تحميل بيانات المستخدم
// ============================================================
async function loadUserInfo() {
    try {
        const res  = await fetch('/api/user/info');
        const data = await res.json();
        if (data.success && data.user) {
            const u = data.user;
            const name  = u.name  || CURRENT_USER_NAME || 'مستخدم';
            const phone = u.phone || '';
            document.getElementById('drawerName').textContent  = name;
            document.getElementById('drawerPhone').textContent = phone;
            document.getElementById('drawerAvatar').textContent = name.charAt(0);
        }
    } catch(e) {
        document.getElementById('drawerName').textContent  = CURRENT_USER_NAME || 'مستخدم';
        document.getElementById('drawerPhone').textContent = '';
        document.getElementById('drawerAvatar').textContent = (CURRENT_USER_NAME||'م').charAt(0);
    }
}

// ============================================================
//  تحميل المحادثات من الخادم
// ============================================================
// ============================================================
//  نظام المحادثات — Map مدمجة + localStorage دائم
// ============================================================
const LS_CHATS_KEY  = `tg_chats_v2_${CURRENT_USER_ID}`;
let   chatsMap      = new Map();   // id → chat object (المصدر الأوحد للحقيقة)
let   _loadingChats = false;

function _toChat(c) {
    const id = String(c.id);
    return {
        id,
        name:       c.name       || 'محادثة',
        is_group:   c.is_group   || false,
        is_channel: c.is_channel || false,
        unread:     c.unread_count ?? c.unread ?? 0,
        lastMsg:    c.last_message?.text || c.lastMsg || '',
        lastTs:     c.last_message?.timestamp ?? c.lastTs ?? 0,
        time:       (c.last_message?.timestamp ?? c.lastTs)
                        ? formatTime(c.last_message?.timestamp ?? c.lastTs) : '',
        pinned:     c.pinned    || false,
        archived:   c.archived  || false,
        color:      avatarColor(id),
        letter:     (c.name || 'م').charAt(0),
    };
}

function _mergeChats(rawList) {
    for (const c of rawList) {
        const parsed = _toChat(c);
        const existing = chatsMap.get(parsed.id);
        // نحتفظ بـ unread و lastMsg الأحدث
        if (!existing || parsed.lastTs >= (existing.lastTs || 0)) {
            chatsMap.set(parsed.id, parsed);
        } else {
            // دمّج فقط البيانات الناقصة
            chatsMap.set(parsed.id, { ...parsed, ...existing });
        }
    }
    _syncChatsData();
}

function _syncChatsData() {
    // ترتيب: المثبّتة أولاً، ثم الأحدث
    chatsData = [...chatsMap.values()].sort((a, b) => {
        if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
        return (b.lastTs || 0) - (a.lastTs || 0);
    });
}

function _saveLs() {
    try {
        // احفظ أحدث 500 محادثة لتوفير الذاكرة
        const toSave = chatsData.slice(0, 500);
        localStorage.setItem(LS_CHATS_KEY, JSON.stringify(toSave));
    } catch(_) {}
}

function _loadLs() {
    try {
        const raw = localStorage.getItem(LS_CHATS_KEY);
        if (!raw) return false;
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed) || !parsed.length) return false;
        for (const c of parsed) chatsMap.set(c.id, c);
        _syncChatsData();
        return true;
    } catch(_) { return false; }
}

// ============================================================
//  تحميل المحادثات — صفحة تلو صفحة + merge
// ============================================================
async function loadChats(showLoader = true) {
    if (_loadingChats) return;
    _loadingChats = true;

    // ① عرض localStorage فوراً (0ms)
    const hadCache = _loadLs();
    if (hadCache) {
        renderChatList();
        showLoader = false;
    }

    if (showLoader) {
        document.getElementById('chatList').innerHTML =
            '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>جاري التحميل...</p></div>';
    }

    const btn = document.getElementById('refreshBtn')?.querySelector('i');
    if (btn) btn.classList.add('fa-spin');

    try {
        // ② جلب الصفحة الأولى بسرعة وعرضها
        const r1   = await fetch('/api/chats?page=1&per_page=150');
        const d1   = await r1.json();
        if (!d1.success) throw new Error(d1.message || 'فشل التحميل');

        _mergeChats(d1.chats);
        renderChatList();

        // ③ جلب الصفحات المتبقية في الخلفية (بدون spinner)
        if (d1.has_more) {
            _fetchRemainingChats(2, d1.total);
        } else {
            _saveLs();
        }
    } catch(e) {
        if (!chatsData.length) {
            document.getElementById('chatList').innerHTML =
                `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>${e.message}</p></div>`;
            showToast('❌ ' + e.message, 'error');
        }
    } finally {
        if (btn) btn.classList.remove('fa-spin');
        _loadingChats = false;
    }
}

async function _fetchRemainingChats(startPage, total) {
    const perPage = 150;
    let page = startPage;
    let fetched = (startPage - 1) * perPage;

    while (fetched < total) {
        try {
            const res  = await fetch(`/api/chats?page=${page}&per_page=${perPage}`);
            const data = await res.json();
            if (!data.success) break;

            _mergeChats(data.chats);
            fetched += data.chats.length;
            renderChatList();

            if (!data.has_more) break;
            page++;

            // استراحة قصيرة بين الصفحات لعدم إثقال السيرفر
            await new Promise(r => setTimeout(r, 300));
        } catch(_) { break; }
    }

    _saveLs();
}

// ============================================================
//  وضع التحديد المتعدد للمحادثات
// ============================================================
let _selMode = false;
const _selectedChats = new Set();
let _lpTimer = null;

function startChatLongPress(chatId) {
    cancelChatLongPress();
    _lpTimer = setTimeout(() => {
        _lpTimer = null;
        if (!_selMode) enterSelectionMode(String(chatId));
        else toggleChatSelection(String(chatId));
    }, 500);
}

function cancelChatLongPress() {
    if (_lpTimer) { clearTimeout(_lpTimer); _lpTimer = null; }
}

function onChatItemClick(e, chatId) {
    // إذا انتهى الـ long press مسبقاً → لا تفعل شيئاً (دخل وضع التحديد)
    if (!_lpTimer && !_selMode) {
        // نقرة عادية — افتح المحادثة
        selectChat(chatId);
        return;
    }
    cancelChatLongPress();
    if (_selMode) toggleChatSelection(String(chatId));
    else selectChat(chatId);
}

function enterSelectionMode(chatId) {
    _selMode = true;
    _selectedChats.clear();
    _selectedChats.add(String(chatId));
    document.getElementById('selectionBar').style.display = 'flex';
    document.getElementById('mainHeader').style.display  = 'none';
    document.getElementById('chatList').classList.add('sel-mode');
    _refreshSelUI();
}

function exitSelectionMode() {
    _selMode = false;
    _selectedChats.clear();
    document.getElementById('selectionBar').style.display = 'none';
    document.getElementById('mainHeader').style.display  = '';
    document.getElementById('chatList').classList.remove('sel-mode');
    document.querySelectorAll('.chat-item.selected').forEach(el => el.classList.remove('selected'));
}

function toggleChatSelection(chatId) {
    const id = String(chatId);
    if (_selectedChats.has(id)) {
        _selectedChats.delete(id);
        if (_selectedChats.size === 0) { exitSelectionMode(); return; }
    } else {
        _selectedChats.add(id);
    }
    _refreshSelUI();
}

function _refreshSelUI() {
    document.getElementById('selCount').textContent = _selectedChats.size;
    document.querySelectorAll('.chat-item[data-cid]').forEach(el => {
        el.classList.toggle('selected', _selectedChats.has(el.dataset.cid));
    });
}

async function pinSelectedChats() {
    let ok = 0;
    for (const id of _selectedChats) {
        try {
            const r = await fetch(`/api/chats/${id}/pin`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({pinned:true})
            });
            const d = await r.json();
            if (d.success) ok++;
        } catch(_) {}
    }
    showToast(ok > 0 ? `📌 تم تثبيت ${ok} محادثة` : '❌ فشل التثبيت', ok > 0 ? 'success' : 'error');
    exitSelectionMode();
    setTimeout(refreshChats, 800);
}

async function muteSelectedChats() {
    let ok = 0;
    for (const id of _selectedChats) {
        try {
            const r = await fetch(`/api/chats/${id}/mute`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({muted:true})
            });
            const d = await r.json();
            if (d.success) ok++;
        } catch(_) {}
    }
    showToast(ok > 0 ? `🔇 تم كتم ${ok} محادثة` : '❌ فشل الكتم', ok > 0 ? 'success' : 'error');
    exitSelectionMode();
}

async function deleteSelectedChats() {
    const count = _selectedChats.size;
    if (!confirm(`حذف ${count} محادثة؟ لا يمكن التراجع عن هذا الإجراء.`)) return;
    let ok = 0;
    for (const id of _selectedChats) {
        try {
            const r = await fetch(`/api/chats/${id}`, {method:'DELETE'});
            const d = await r.json();
            if (d.success) ok++;
        } catch(_) {}
    }
    showToast(ok > 0 ? `🗑️ تم حذف ${ok} محادثة` : '❌ فشل الحذف', ok > 0 ? 'success' : 'error');
    exitSelectionMode();
    setTimeout(refreshChats, 800);
}

function showSelectionMoreMenu(e) {
    e.stopPropagation();
    showRichContextMenu(e.clientX, e.clientY, [
        { icon:'📁', label:'أرشفة',           fn: () => archiveSelectedChats() },
        { icon:'✅', label:'تعليم كمقروء',     fn: () => markSelectedAsRead() },
        { icon:'🚫', label:'حظر',             danger:true, fn: () => blockSelectedChats() },
    ]);
}

async function archiveSelectedChats() {
    let ok = 0;
    for (const id of _selectedChats) {
        try {
            const r = await fetch(`/api/chats/${id}/archive`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({archived:true})
            });
            const d = await r.json();
            if (d.success) ok++;
        } catch(_) {}
    }
    showToast(ok > 0 ? `📁 تم أرشفة ${ok} محادثة` : '❌ فشل', ok > 0 ? 'success' : 'error');
    exitSelectionMode();
    setTimeout(refreshChats, 800);
}

async function markSelectedAsRead() {
    let ok = 0;
    for (const id of _selectedChats) {
        try {
            const r = await fetch(`/api/chats/${id}/read`, {method:'POST'});
            const d = await r.json();
            if (d.success) ok++;
        } catch(_) {}
    }
    showToast(ok > 0 ? `✅ تم تعليم ${ok} محادثة كمقروءة` : '❌ فشل', ok > 0 ? 'success' : 'error');
    exitSelectionMode();
}

async function blockSelectedChats() {
    if (!confirm(`حظر ${_selectedChats.size} جهة اتصال؟`)) return;
    let ok = 0;
    for (const id of _selectedChats) {
        try {
            const r = await fetch(`/api/users/${id}/block`, {method:'POST'});
            const d = await r.json();
            if (d.success) ok++;
        } catch(_) {}
    }
    showToast(ok > 0 ? `🚫 تم حظر ${ok}` : '❌ فشل', ok > 0 ? 'success' : 'error');
    exitSelectionMode();
}

// ============================================================
//  عرض قائمة المحادثات
// ============================================================
function renderChatList(search = '') {
    const list = document.getElementById('chatList');
    const q    = search.trim().toLowerCase();

    let filtered = chatsData.filter(c =>
        !q || c.name.toLowerCase().includes(q) || c.lastMsg.toLowerCase().includes(q)
    );

    if (!filtered.length) {
        list.innerHTML = `<div class="empty-state"><i class="fas fa-comment-slash"></i><p>${q ? 'لا توجد نتائج' : 'لا توجد محادثات'}</p></div>`;
        return;
    }

    list.innerHTML = filtered.map(c => `
        <div class="chat-item ${String(c.id) === String(currentChatId) ? 'active' : ''} ${_selectedChats.has(String(c.id)) ? 'selected' : ''}"
             id="chat-item-${c.id}"
             data-cid="${c.id}"
             onclick="onChatItemClick(event,'${c.id}')"
             onmousedown="startChatLongPress('${c.id}')"
             onmouseup="cancelChatLongPress()"
             onmouseleave="cancelChatLongPress()"
             ontouchstart="startChatLongPress('${c.id}')"
             ontouchend="cancelChatLongPress()"
             ontouchcancel="cancelChatLongPress()">
            <div class="avatar" style="background:${c.color};">
                <span class="av-letter">${c.letter}</span>
                <div class="av-check"><i class="fas fa-check"></i></div>
            </div>
            <div class="info">
                <div class="row1">
                    <span class="name">${escHtml(c.name)}</span>
                    <span class="time">${c.time}</span>
                </div>
                <div class="preview">${escHtml(c.lastMsg)}</div>
            </div>
            ${c.unread > 0 ? `<span class="badge">${c.unread > 99 ? '99+' : c.unread}</span>` : ''}
        </div>
    `).join('');
}

// ============================================================
//  اختيار محادثة وفتحها
// ============================================================
async function selectChat(id) {
    id = String(id);

    // مغادرة الغرفة السابقة
    if (currentChatId && currentChatId !== id) {
        socket.emit('leave_chat', { user_id: CURRENT_USER_ID, chat_id: currentChatId });
        stopTyping();
    }

    currentChatId   = id;
    currentChatData = chatsMap.get(id) || chatsData.find(c => String(c.id) === id);

    // إلغاء الرد إن وجد
    cancelReply();

    // تحديث نشاط الغرفة
    socket.emit('join_chat', { user_id: CURRENT_USER_ID, chat_id: id });
    socket.emit('mark_as_read', { user_id: CURRENT_USER_ID, chat_id: id });

    // تحديث رأس المحادثة
    if (currentChatData) {
        document.getElementById('chatAvatar').textContent    = currentChatData.letter;
        document.getElementById('chatAvatar').style.background = currentChatData.color;
        document.getElementById('chatName').textContent      = currentChatData.name;
        document.getElementById('chatStatus').textContent    = currentChatData.is_group ? '👥 مجموعة' : '...';
        document.getElementById('chatStatus').className      = 'h-status';
    }

    // تصفير العداد في القائمة
    const item = document.querySelector(`#chat-item-${id}`);
    if (item) { const badge = item.querySelector('.badge'); if (badge) badge.remove(); }
    const _chatRef = chatsMap.get(id);
    if (_chatRef) { _chatRef.unread = 0; chatsMap.set(id, _chatRef); }

    // فتح واجهة المحادثة
    openChatView();

    // عرض الكاش فوراً إن وجد، وإلا spinner
    if (chatMessages[id] && chatMessages[id].length) {
        renderMessages(chatMessages[id]);
        // تحديث صامت في الخلفية
        loadMessages(id, true);
    } else {
        document.getElementById('messagesArea').innerHTML =
            '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i></div>';
        await loadMessages(id, false);
    }

    // تحديث نشاط القائمة
    renderChatList(document.getElementById('searchInput').value);
}

// ============================================================
//  تحميل الرسائل
// ============================================================
async function loadMessages(chatId, silent = false) {
    try {
        const res  = await fetch(`/api/chats/${chatId}/messages?limit=50`);
        const data = await res.json();

        if (!data.success) throw new Error(data.message || 'فشل');

        const msgs = (data.messages || []).reverse();
        // تحديث الكاش دائماً
        chatMessages[chatId] = msgs;
        // في الوضع الصامت: أعد الرسم فقط إذا كانت المحادثة لا تزال مفتوحة
        if (!silent || String(currentChatId) === String(chatId)) {
            const area = document.getElementById('messagesArea');
            const atBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 60;
            renderMessages(msgs);
            if (atBottom) scrollToBottom();
        }
    } catch(e) {
        if (!silent) {
            document.getElementById('messagesArea').innerHTML =
                `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>${e.message}</p></div>`;
        }
    }
}

// ============================================================
//  عرض الرسائل
// ============================================================
function renderMessages(msgs) {
    const area = document.getElementById('messagesArea');
    if (!msgs.length) {
        area.innerHTML = '<div class="empty-state"><i class="far fa-comment-dots"></i><p>لا توجد رسائل بعد</p></div>';
        return;
    }

    let html = '';
    let lastDate = '';

    msgs.forEach(m => {
        const isSent = m.from_me || String(m.sender_id) === CURRENT_USER_ID;
        const cls    = isSent ? 'sent' : 'received';
        const time   = m.timestamp ? formatTime(m.timestamp) : '';
        const mDate  = m.timestamp ? formatDate(m.timestamp) : '';
        const sId    = m.sender_id || '';
        const sName  = m.sender_name || '';
        const rawText = (m.text || '').replace(/"/g,'&quot;');

        if (mDate && mDate !== lastDate) {
            html += `<div class="date-divider"><span>${mDate}</span></div>`;
            lastDate = mDate;
        }

        html += `
        <div class="msg ${cls}" data-msg-id="${m.id}" data-sid="${sId}" data-sname="${escHtml(sName)}" data-text="${rawText}"
             oncontextmenu="showMsgMenu(event,this)" onclick="onMsgClick(event,this)">
            <div class="bubble">
                ${!isSent && sName ? `<div class="sender" onclick="event.stopPropagation();showSenderProfile(event,'${sId}','${escHtml(sName)}')">${escHtml(sName)}</div>` : ''}
                <div class="text">${renderTextWithLinks(m.text || '')}</div>
                <div class="foot">
                    <span>${time}</span>
                    ${isSent ? `<span class="ticks" id="tick-${m.id}">✓</span>` : ''}
                </div>
            </div>
        </div>`;
    });

    area.innerHTML = html;
    scrollToBottom();
}

// ============================================================
//  إضافة رسالة واحدة إلى النافذة
// ============================================================
function appendMessage(msg) {
    const area   = document.getElementById('messagesArea');
    const isSent = msg.from_me || String(msg.sender_id) === CURRENT_USER_ID;
    const cls    = isSent ? 'sent' : 'received';
    const time   = msg.timestamp ? formatTime(msg.timestamp) : formatTimeNow();
    const sId    = msg.sender_id || '';
    const sName  = msg.sender_name || '';

    // إزالة حالة الفراغ إن وجدت
    const empty = area.querySelector('.empty-state');
    if (empty) empty.remove();

    const div = document.createElement('div');
    div.className  = `msg ${cls}`;
    div.dataset.msgId  = msg.id || '';
    div.dataset.sid    = sId;
    div.dataset.sname  = sName;
    div.dataset.text   = msg.text || '';
    div.setAttribute('oncontextmenu', `showMsgMenu(event,this)`);
    div.setAttribute('onclick',       `onMsgClick(event,this)`);
    div.innerHTML = `
        <div class="bubble">
            ${!isSent && sName ? `<div class="sender" onclick="event.stopPropagation();showSenderProfile(event,'${sId}','${escHtml(sName)}')">${escHtml(sName)}</div>` : ''}
            <div class="text">${renderTextWithLinks(msg.text || '')}</div>
            <div class="foot">
                <span>${time}</span>
                ${isSent ? `<span class="ticks" id="tick-${msg.id}">⏳</span>` : ''}
            </div>
        </div>`;
    area.appendChild(div);
    scrollToBottom();
}

// ============================================================
//  إرسال رسالة
// ============================================================
function sendMessage() {
    const input = document.getElementById('messageInput');
    const text  = input.value.trim();
    if (!text || !currentChatId) return;

    const msgId = 'local_' + Date.now();
    const now   = Math.floor(Date.now() / 1000);

    // عرض الرسالة محلياً فوراً
    const localMsg = {
        id:         msgId,
        sender_id:  CURRENT_USER_ID,
        sender_name: CURRENT_USER_NAME,
        text:       text,
        timestamp:  now,
        from_me:    true,
        chat_id:    currentChatId,
    };
    appendMessage(localMsg);

    // إرسال عبر Socket.IO
    socket.emit('send_message', {
        user_id:    CURRENT_USER_ID,
        chat_id:    currentChatId,
        text:       text,
        message_id: msgId,
        reply_to:   replyToMsgId || undefined,
    });

    // تحديث آخر رسالة في القائمة
    updateChatLastMsg(currentChatId, localMsg);

    // إعادة تعيين
    input.value = '';
    autoResize(input);
    cancelReply();
    stopTyping();
}

// ============================================================
//  مساعدات العرض
// ============================================================
function openChatView() {
    document.getElementById('chatView').classList.add('open');
    document.getElementById('noChatState').style.display = 'none';
    if (window.innerWidth <= 820) {
        document.getElementById('leftPane').classList.add('hidden');
        document.getElementById('rightPane').classList.add('active');
    }
}

function closeChat() {
    currentChatId = null;
    document.getElementById('chatView').classList.remove('open');
    document.getElementById('noChatState').style.display = '';
    document.getElementById('leftPane').classList.remove('hidden');
    document.getElementById('rightPane').classList.remove('active');
    renderChatList(document.getElementById('searchInput').value);
}

function scrollToBottom() {
    const area = document.getElementById('messagesArea');
    area.scrollTop = area.scrollHeight;
}

function updateChatLastMsg(chatId, msg) {
    const id   = String(chatId);
    const chat = chatsMap.get(id);
    if (chat) {
        chat.lastMsg = msg.text || '';
        chat.lastTs  = msg.timestamp || Math.floor(Date.now()/1000);
        chat.time    = formatTime(chat.lastTs);
        chatsMap.set(id, chat);
        _syncChatsData();
    } else {
        // محادثة غير موجودة في القائمة — أضفها مؤقتاً وحدّث القائمة
        chatsMap.set(id, {
            id, name: msg.sender_name || 'محادثة',
            is_group: false, is_channel: false,
            unread: 0, lastMsg: msg.text || '',
            lastTs: msg.timestamp || Math.floor(Date.now()/1000),
            time:   formatTime(msg.timestamp || Math.floor(Date.now()/1000)),
            pinned: false, archived: false,
            color: avatarColor(id),
            letter: (msg.sender_name || 'م').charAt(0),
        });
        _syncChatsData();
    }
    renderChatList(document.getElementById('searchInput').value);
    _saveLs();
}

function updateChatUnread(chatId) {
    const id   = String(chatId);
    const chat = chatsMap.get(id);
    if (chat) {
        chat.unread = (chat.unread || 0) + 1;
        chatsMap.set(id, chat);
        _syncChatsData();
    }
    renderChatList(document.getElementById('searchInput').value);
}

function markMsgDelivered(msgId) {
    const el = document.getElementById('tick-' + msgId);
    if (el) el.textContent = '✓✓';
}

function markMsgFailed(msgId) {
    const el = document.querySelector(`[data-msg-id="${msgId}"]`);
    if (el) el.style.opacity = '0.5';
}

// ============================================================
//  مؤشر الكتابة
// ============================================================
function onTyping() {
    if (!currentChatId) return;
    if (!isTyping) {
        isTyping = true;
        socket.emit('typing_start', { user_id: CURRENT_USER_ID, chat_id: currentChatId });
    }
    clearTimeout(typingTimer);
    typingTimer = setTimeout(stopTyping, 3000);
}

function stopTyping() {
    if (isTyping && currentChatId) {
        socket.emit('typing_stop', { user_id: CURRENT_USER_ID, chat_id: currentChatId });
    }
    isTyping = false;
    clearTimeout(typingTimer);
}

function showTypingIndicator(show, userId) {
    const el = document.getElementById('typingIndicator');
    el.classList.toggle('show', !!show);
    if (show) scrollToBottom();
}

// ============================================================
//  الرد على رسالة
// ============================================================
function replyTo(msgId, text) {
    replyToMsgId = msgId;
    document.getElementById('replyText').textContent = text;
    document.getElementById('replyBar').classList.add('show');
    document.getElementById('messageInput').focus();
}

function cancelReply() {
    replyToMsgId = null;
    document.getElementById('replyBar').classList.remove('show');
}

// ============================================================
//  قائمة السياق للرسائل
// ============================================================
function onMsgClick(e, msgEl) {
    // لا تُفعِّل عند النقر على رابط أو اسم المرسل
    if (e.target.classList.contains('msg-link') || e.target.classList.contains('sender')) return;
    showMsgMenu(e, msgEl);
}

function showMsgMenu(e, msgEl) {
    e.preventDefault();
    e.stopPropagation();
    const msgId  = msgEl.dataset.msgId;
    const text   = msgEl.dataset.text || msgEl.querySelector('.text')?.textContent || '';
    const isSent = msgEl.classList.contains('sent');

    const actions = [
        { icon: '↩',  label: 'رد',      fn: () => replyTo(msgId, text) },
        { icon: '⧉',  label: 'نسخ',     fn: () => { try { navigator.clipboard.writeText(text); } catch(_){} showToast('✅ تم النسخ', 'success'); } },
        { icon: '→',  label: 'تحويل',   fn: () => forwardMessage(msgId) },
        { icon: '📌', label: 'تثبيت',   fn: () => pinMessage(msgId) },
        { icon: '⭐', label: 'حفظ',     fn: () => bookmarkMessage(msgId, text) },
    ];
    if (isSent) {
        actions.push({ icon: '✏️', label: 'تعديل', fn: () => editMessage(msgId, text) });
        actions.push({ icon: '🗑',  label: 'حذف',  danger: true, fn: () => deleteMessage(msgId) });
    } else {
        actions.push({ icon: '🗑',  label: 'حذف للجميع', danger: true, fn: () => deleteMessage(msgId) });
    }

    showRichContextMenu(e.clientX, e.clientY, actions);
}

function showRichContextMenu(x, y, actions) {
    document.querySelectorAll('.ctx-menu').forEach(el => el.remove());
    const menu = document.createElement('div');
    menu.className = 'ctx-menu';

    // منع الخروج عن حدود الشاشة
    const menuW = 195, menuH = actions.length * 46 + 12;
    const px = Math.min(x, window.innerWidth  - menuW - 8);
    const py = Math.min(y, window.innerHeight - menuH - 8);

    menu.style.cssText = `
        position:fixed; left:${px}px; top:${py}px; z-index:9999;
        background:var(--tg-bg-secondary); border:1px solid var(--tg-border);
        border-radius:14px; padding:4px 0; box-shadow:0 8px 32px rgba(0,0,0,.4);
        min-width:${menuW}px; direction:rtl; animation:ctxFadeIn .15s ease;
    `;
    actions.forEach((a, idx) => {
        if (idx > 0) {
            const sep = document.createElement('div');
            sep.style.cssText = 'height:1px;background:var(--tg-border);margin:0 10px;';
            menu.appendChild(sep);
        }
        const btn = document.createElement('button');
        btn.style.cssText = `
            display:flex;align-items:center;gap:10px;width:100%;
            padding:11px 16px;background:none;border:none;cursor:pointer;
            font-size:14px;font-family:Tajawal,sans-serif;color:${a.danger ? '#ff4757' : 'var(--tg-text)'};
            transition:background .12s;
        `;
        btn.innerHTML = `<span style="font-size:16px;min-width:20px;text-align:center;">${a.icon}</span><span>${a.label}</span>`;
        btn.onmouseenter = () => btn.style.background = 'rgba(255,255,255,.06)';
        btn.onmouseleave = () => btn.style.background = 'none';
        btn.onclick = () => { a.fn(); menu.remove(); };
        menu.appendChild(btn);
    });
    document.body.appendChild(menu);
    setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 10);
}

/* دالة احتياطية للمتوافقية مع الكود القديم */
function showContextMenu(x, y, actions) {
    const mapped = actions.map(a => ({ icon: '', label: a.label, fn: a.fn }));
    showRichContextMenu(x, y, mapped);
}
function msgContextMenu(e, msgId) {
    const area  = document.getElementById('messagesArea');
    const msgEl = area?.querySelector(`[data-msg-id="${msgId}"]`);
    if (msgEl) showMsgMenu(e, msgEl);
}

// ============================================================
//  عمليات الرسائل (حذف / تعديل / حفظ)
// ============================================================
function deleteMessage(msgId) {
    if (!confirm('حذف هذه الرسالة؟')) return;
    socket.emit('delete_message', { user_id: CURRENT_USER_ID, chat_id: currentChatId, message_id: msgId });
    showToast('🗑️ جاري الحذف...', 'info');
}

function editMessage(msgId, currentText) {
    const newText = prompt('تعديل الرسالة:', currentText);
    if (!newText || newText === currentText) return;
    socket.emit('edit_message', {
        user_id: CURRENT_USER_ID, chat_id: currentChatId,
        message_id: msgId, new_text: newText
    });
    showToast('✏️ جاري التعديل...', 'info');
}

async function bookmarkMessage(msgId, text) {
    try {
        const res = await fetch('/api/messages/bookmark', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: currentChatId, message_id: msgId, text })
        });
        const data = await res.json();
        showToast(data.success ? '⭐ تم الحفظ' : '❌ فشل الحفظ', data.success ? 'success' : 'error');
    } catch(e) { showToast('❌ خطأ في الاتصال', 'error'); }
}

// ============================================================
//  قائمة سياق الروابط
// ============================================================
function showLinkMenu(e, url, type) {
    e.preventDefault();
    e.stopPropagation();
    const isInvite = type === 'invite';
    const actions = [];
    if (isInvite) {
        actions.push({ icon: '🚀', label: 'انضمام للمجموعة', fn: () => joinInviteLink(url) });
    }
    actions.push(
        { icon: '🌐', label: 'فتح',           fn: () => window.open(url, '_blank', 'noopener') },
        { icon: '📋', label: 'نسخ الرابط',    fn: () => { try { navigator.clipboard.writeText(url); } catch(_){} showToast('✅ تم نسخ الرابط', 'success'); } },
        { icon: '→',  label: 'إرسال للمحادثة', fn: () => { const inp = document.getElementById('messageInput'); if(inp){ inp.value = url; inp.focus(); } } }
    );
    // زر حذف الرسالة الحاوية
    const msgEl = e.target?.closest?.('.msg');
    if (msgEl) {
        const mId = msgEl.dataset.msgId;
        actions.push({ icon: '🗑', label: 'حذف الرسالة', danger: true, fn: () => deleteMessage(mId) });
    }
    showRichContextMenu(e.clientX, e.clientY, actions);
}

async function joinInviteLink(url) {
    try {
        const res  = await fetch('/api/groups/join', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body:   JSON.stringify({ invite_link: url })
        });
        const data = await res.json();
        showToast(data.success ? '✅ تم الانضمام' : '❌ ' + data.message,
                  data.success ? 'success' : 'error');
    } catch(_) { showToast('❌ خطأ في الانضمام', 'error'); }
}

    const initLetter = (userName || '?')[0].toUpperCase();

    document.getElementById('spBanner').style.background = `linear-gradient(135deg,${color}88,${color}33)`;
    document.getElementById('spAvatar').style.background  = color;
    document.getElementById('spAvatar').textContent       = initLetter;
    document.getElementById('spName').textContent         = userName || 'مستخدم';
    document.getElementById('spUsername').textContent     = '';
    document.getElementById('spPhone').textContent        = '';
    document.getElementById('spBio').textContent          = '';
    document.getElementById('spGroups').textContent       = '⏳ جارٍ التحميل...';

    // ربط الأزرار
    document.getElementById('spAddBtn').onclick = () => addContact(userId, userName);
    document.getElementById('spBlockBtn').onclick = async () => {
        if (!confirm(`حظر ${userName}؟`)) return;
        try {
            const r = await fetch(`/api/users/${userId}/block`, {method:'POST'});
            const d = await r.json();
            showToast(d.success ? '🚫 تم الحظر' : '❌ '+d.message, d.success ? 'success' : 'error');
            if (d.success) modal.style.display = 'none';
        } catch(_) { showToast('❌ خطأ', 'error'); }
    };
    document.getElementById('spMsgBtn').onclick = () => {
        modal.style.display = 'none';
        // افتح المحادثة المباشرة
        const existing = chatsData?.find(c => String(c.id) === String(userId));
        if (existing) selectChat(existing.id);
        else { showToast('💬 جارٍ فتح المحادثة...', 'info'); selectChat(parseInt(userId)); }
    };

    // جلب الملف الشخصي من الخادم
    try {
        const res  = await fetch(`/api/user-profile/${userId}`);
        const data = await res.json();
        if (data.success && data.profile) {
            const p = data.profile;
            document.getElementById('spUsername').textContent = p.username ? '@' + p.username : '';
            document.getElementById('spPhone').textContent    = p.phone    ? '📞 ' + p.phone  : '';
            document.getElementById('spBio').textContent      = p.bio      || '';
            const cg = p.common_groups_count;
            document.getElementById('spGroups').textContent   = cg ? `👥 ${cg} مجموعة مشتركة` : '👥 لا توجد مجموعات مشتركة';
        } else {
            document.getElementById('spGroups').textContent = '';
        }
    } catch(_) {
        document.getElementById('spGroups').textContent = '';
    }
}

function renderTextWithLinks(text) {
    if (!text) return '';
    const urlRegex = /(https?:\/\/[^\s<>"']+)/g;
    const parts = text.split(urlRegex);
    return parts.map((part, i) => {
        if (i % 2 === 1) { // URL
            const isInvite = part.includes('t.me/+') || part.includes('t.me/joinchat');
            const safeUrl  = part.replace(/\\/g,'\\\\').replace(/'/g, '%27');
            return `<a href="#" class="msg-link" onclick="showLinkMenu(event,'${safeUrl}','${isInvite?'invite':'url'}')">${escHtml(part)}</a>`;
        }
        return escHtml(part);
    }).join('');
}

async function forwardMessage(msgId) {
    const names = chatsData?.map(c => `${c.id}: ${c.name}`).slice(0, 10).join('\n') || '';
    const input = prompt(`أدخل ID المحادثة للتحويل إليها:\n${names}`);
    if (!input) return;
    const toChatId = parseInt(input.trim());
    if (!toChatId) { showToast('⚠️ معرّف غير صالح', 'warning'); return; }
    try {
        const res  = await fetch('/api/messages/forward', {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body:   JSON.stringify({ from_chat_id: currentChatId, to_chat_id: toChatId, message_ids: [msgId] })
        });
        const data = await res.json();
        showToast(data.success ? '✅ تم التحويل' : '❌ ' + data.message,
                  data.success ? 'success' : 'error');
    } catch(_) { showToast('❌ خطأ', 'error'); }
}

async function handleFileSelect(input) {
    if (!input.files.length || !currentChatId) return;
    const file = input.files[0];
    showToast(`📎 جاري رفع ${file.name}...`, 'info');

    const fd = new FormData();
    fd.append('file', file);
    try {
        const res  = await fetch('/api/upload', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.success) {
            // إرسال رابط الملف كرسالة
            document.getElementById('messageInput').value = `📎 ${data.original || file.name}: ${data.url}`;
            sendMessage();
            showToast('✅ تم رفع الملف', 'success');
        } else {
            showToast('❌ ' + (data.message || 'فشل الرفع'), 'error');
        }
    } catch(e) { showToast('❌ خطأ أثناء الرفع', 'error'); }
    input.value = '';
}

function applyTheme(theme) {
    currentTheme = theme;
    document.body.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
    const icon  = document.getElementById('themeIcon');
    const label = document.getElementById('themeLabel');
    if (theme === 'dark') {
        icon.className  = 'fas fa-sun';
        label.textContent = 'الوضع الفاتح';
    } else {
        icon.className  = 'fas fa-moon';
        label.textContent = 'الوضع المظلم';
    }
    // حفظ في الخادم
    fetch('/api/settings/theme', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ theme })
    }).catch(() => {});
}

function toggleTheme() {

}

function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const toast     = document.createElement('div');
    toast.className = `toast-custom ${type}`;
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(() => {
        toast.classList.add('fade-out');
        setTimeout(() => toast.remove(), 350);
    }, 3500);
}

function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatTime(ts) {
    const d = new Date(ts * 1000);
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'م' : 'ص';
    h = h % 12 || 12;
    return h + ':' + m.toString().padStart(2,'0') + ' ' + ampm;
}

function formatTimeNow() {
    const d = new Date();
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'م' : 'ص';
    h = h % 12 || 12;
    return h + ':' + m.toString().padStart(2,'0') + ' ' + ampm;
}

function formatDate(ts) {
    const d   = new Date(ts * 1000);
    const now = new Date();
    const diff = Math.floor((now - d) / 86400000);
    if (diff === 0) return 'اليوم';
    if (diff === 1) return 'الأمس';
    return d.toLocaleDateString('ar-SA', { day: 'numeric', month: 'long' });
}

function avatarColor(id) {
    const colors = ['#6c5ce7','#00d2ff','#ff6b6b','#f9ca24','#2ecc71','#e17055','#a29bfe','#fd79a8','#00b894','#0984e3'];
    let hash = 0;
    for (let i = 0; i < id.length; i++) hash = (hash * 31 + id.charCodeAt(i)) | 0;
    return colors[Math.abs(hash) % colors.length];
}
